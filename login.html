<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Do Eat - Login</title>
    <meta name="theme-color" content="#E60000">
    <link rel="icon" type="image/png" href="/images/icons/logo-justdoeat-recortado.png">
    <link rel="preload" href="/fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form.css">
</head>
<body>
{{> header}}

<main id="conteudo" class="form-page">
    <div class="container">
        <form class="form-card" action="/api/login" method="post" id="login-form" novalidate>
            <img src="/images/icons/logo-justdoeat-recortado.png" alt="" class="form-card-logo" width="84" height="84">
            <h1>Entre com a sua conta!</h1>
            <p class="form-intro" data-login-intro>Que bom ver você de novo.</p>
            <input type="hidden" name="next" value="">

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>

            <div class="form-links">
                <a href="/cadastro" data-keep-next>Criar conta</a>
                <a href="/contato">Esqueceu a senha?</a>
            </div>

            {{demoAccounts}}
        </form>
    </div>
</main>

{{> footer-compacto}}
<script src="/js/login.js"></script>
</body>
</html>
