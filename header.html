<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header">
    <div class="container header-inner">
        <a href="/" class="brand">
            <img src="/images/icons/logo-justdoeat-recortado.png" alt="Just do Eat, página inicial" width="54" height="54">
        </a>

        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="header-menu" data-nav-toggle>
            <span class="nav-toggle-bars" aria-hidden="true"></span>
            <span class="sr-only">Abrir menu</span>
        </button>

        <div class="header-menu" id="header-menu">
            <nav class="site-nav" aria-label="Principal">
                <ul>
                    <li><a data-nav href="/">Início</a></li>
                    <li><a data-nav href="/restaurantes">Restaurantes</a></li>
                    <li><a data-nav href="/restaurantes?categoria=comidas">Comidas</a></li>
                    <li><a data-nav href="/restaurantes?categoria=bebidas">Bebidas</a></li>
                    <li><a data-nav href="/quem-somos">Quem somos</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <form class="header-search" action="/restaurantes" method="get" role="search">
                    <label class="sr-only" for="header-search-input">Buscar restaurante ou prato</label>
                    <input id="header-search-input" type="search" name="q" placeholder="Buscar">
                    <button type="submit" aria-label="Buscar">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                    </button>
                </form>
                {{cartLink}}
                {{authActions}}
            </div>
        </div>
    </div>
</header>
