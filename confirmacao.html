<dialog class="confirm-dialog" data-confirm-dialog aria-labelledby="confirm-title">
    <form method="dialog">
        <h2 id="confirm-title" data-confirm-title>Confirmar</h2>
        <p data-confirm-message></p>
        <div class="confirm-actions">
            <button value="cancel" class="btn btn-secondary" data-confirm-cancel>Cancelar</button>
            <button value="ok" class="btn btn-primary" data-confirm-ok>Confirmar</button>
        </div>
    </form>
</dialog>
<script src="/js/app.js"></script>
